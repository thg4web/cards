<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Field Cards — deck preview</title>
<link rel="stylesheet" href="css/card.css">
<style>
  :root{
    --bg:#0c0b0a; --panel:#151310; --ink:#ede9e3; --muted:#928c83;
    --accent:#e36a1e; --line:rgba(237,233,227,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header.bar{
    position:sticky; top:0; z-index:10;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:12px 18px; background:rgba(12,11,10,.94);
    border-bottom:1px solid var(--line); backdrop-filter:blur(6px);
  }
  .bar .brand{
    font-family:"Chakra Petch",system-ui,sans-serif; font-weight:700;
    letter-spacing:.02em; font-size:15px; color:var(--accent); white-space:nowrap;
  }
  .bar .nav{display:flex; align-items:center; gap:6px}
  .bar button, .bar .toggle b{
    font-family:"Saira Condensed",system-ui,sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.06em; font-size:12px;
    color:var(--ink); background:var(--panel); border:1px solid var(--line);
    padding:6px 10px; border-radius:5px; cursor:pointer; line-height:1;
  }
  .bar button:hover{border-color:var(--accent)}
  .bar input[type=number]{
    width:58px; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-family:"Saira Condensed",system-ui,sans-serif; font-size:13px;
    padding:6px 8px; border-radius:5px;
  }
  .bar .title{
    font-family:"Chakra Petch",system-ui,sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.03em; font-size:14px;
  }
  .bar .title .l{color:var(--accent); margin-right:8px}
  .bar .meta{
    font-family:"Saira Condensed",system-ui,sans-serif; text-transform:uppercase;
    letter-spacing:.06em; font-size:11px; color:var(--muted);
  }
  .bar .spacer{flex:1}
  .toggle{display:flex; gap:0; border:1px solid var(--line); border-radius:5px; overflow:hidden}
  .toggle b{border:0; border-radius:0}
  .toggle b.on{background:var(--accent); color:#160b03}

  .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:7px; vertical-align:middle}
  .st-stub{background:#6f6862}
  .st-draft{background:var(--accent)}
  .st-review{background:#8fb7c4}
  .st-final{background:#5a8a5a}

  .chips{
    display:flex; flex-wrap:wrap; gap:3px; padding:10px 18px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .chips button{
    font-family:"Saira Condensed",system-ui,sans-serif; font-size:11px; font-weight:600;
    width:30px; height:26px; padding:0; color:var(--muted);
    background:transparent; border:1px solid transparent; border-radius:4px; cursor:pointer;
    position:relative;
  }
  .chips button:hover{color:var(--ink); border-color:var(--line)}
  .chips button.on{color:#160b03; background:var(--accent); border-color:var(--accent)}
  .chips button i{
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    width:5px; height:5px; border-radius:50%;
  }

  main{padding:26px 18px 60px}
  .stage{display:flex; flex-wrap:wrap; gap:30px; justify-content:center; align-items:flex-start}
  .slot{flex:1 1 640px; max-width:860px; min-width:320px}
  .slot .cap{
    font-family:"Saira Condensed",system-ui,sans-serif; text-transform:uppercase;
    letter-spacing:.14em; font-size:11px; color:var(--muted); margin:0 0 8px 2px;
  }
  .slot .cap b{color:var(--accent); font-weight:600}
  .hint{
    text-align:center; color:var(--muted); font-size:12px; margin-top:26px;
    font-family:"Saira Condensed",system-ui,sans-serif; letter-spacing:.05em; text-transform:uppercase;
  }
  @media (max-width:720px){ .bar .brand{width:100%} }
</style>
</head>
<body>

<header class="bar">
  <span class="brand">Lunar Field Cards</span>
  <div class="nav">
    <button id="prev" aria-label="Previous card">◀</button>
    <input type="number" id="jump" min="1" max="100" value="5">
    <button id="next" aria-label="Next card">▶</button>
  </div>
  <span class="title"><span class="l" id="tl">L 5</span><span id="tn">Copernicus</span></span>
  <span class="meta" id="tm"></span>
  <span class="spacer"></span>
  <div class="toggle" id="view">
    <b data-v="both" class="on">Both</b>
    <b data-v="front">Front</b>
    <b data-v="back">Back</b>
  </div>
</header>

<div class="chips" id="chips"></div>

<main>
  <div class="stage" id="stage"></div>
  <p class="hint">← → to move &nbsp;·&nbsp; F / B to flip &nbsp;·&nbsp; deep-link with #L5</p>
</main>

<script src="data/lunar100.js"></script>
<script src="data/cards.js"></script>
<script src="js/card.js"></script>
<script>
(function () {
  "use strict";
  var IDS = LFC.ids();
  var stage = document.getElementById("stage");
  var chips = document.getElementById("chips");
  var jump = document.getElementById("jump");
  var view = "both";
  var idx = 4; // L5

  // build the L-number chip strip
  IDS.forEach(function (id, i) {
    var g = LFC.get(id);
    var b = document.createElement("button");
    b.textContent = g.spine[0];
    b.title = g.spine[3];
    var dot = document.createElement("i");
    dot.className = "st-" + (g.card.status || "stub");
    b.appendChild(dot);
    b.addEventListener("click", function () { idx = i; render(); });
    chips.appendChild(b);
  });

  function render() {
    if (idx < 0) idx = IDS.length - 1;
    if (idx >= IDS.length) idx = 0;
    var id = IDS[idx];
    var g = LFC.get(id);
    var zoneName = LFC.ZONE_LABEL[g.card.zone] ? LFC.ZONE_LABEL[g.card.zone].join(" ") : "no zone";
    var catName = LFC.CAT_LABEL[g.card.cat] || g.card.cat;

    document.getElementById("tl").textContent = "L " + g.spine[0];
    document.getElementById("tn").textContent = g.spine[3];
    document.getElementById("tm").innerHTML = zoneName + " · " + catName +
      ' · dSeed ' + g.card.dSeed +
      '<span class="status-dot st-' + (g.card.status || "stub") + '"></span>' + (g.card.status || "stub");
    jump.value = g.spine[0];
    location.hash = id;

    Array.prototype.forEach.call(chips.children, function (c, i) {
      c.classList.toggle("on", i === idx);
    });

    var slots = [];
    if (view === "both" || view === "front")
      slots.push('<div class="slot"><p class="cap"><b>&rsaquo;</b> Front — locate it</p>' + LFC.renderFront(id) + '</div>');
    if (view === "both" || view === "back")
      slots.push('<div class="slot"><p class="cap"><b>&rsaquo;</b> Back — know it</p>' + LFC.renderBack(id) + '</div>');
    stage.innerHTML = slots.join("");
  }

  document.getElementById("prev").addEventListener("click", function () { idx--; render(); });
  document.getElementById("next").addEventListener("click", function () { idx++; render(); });
  jump.addEventListener("change", function () {
    var n = parseInt(jump.value, 10);
    if (n >= 1 && n <= IDS.length) { idx = n - 1; render(); }
  });
  document.getElementById("view").addEventListener("click", function (e) {
    var b = e.target.closest("b[data-v]"); if (!b) return;
    view = b.dataset.v;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle("on", c === b); });
    render();
  });
  window.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft") { idx--; render(); }
    else if (e.key === "ArrowRight") { idx++; render(); }
    else if (e.key.toLowerCase() === "f") { view = "front"; syncToggle(); render(); }
    else if (e.key.toLowerCase() === "b") { view = "back"; syncToggle(); render(); }
    else if (e.key.toLowerCase() === "d") { view = "both"; syncToggle(); render(); }
  });
  function syncToggle() {
    Array.prototype.forEach.call(document.getElementById("view").children, function (c) {
      c.classList.toggle("on", c.dataset.v === view);
    });
  }

  var h = (location.hash || "").replace("#", "").toUpperCase();
  var hi = IDS.indexOf(h);
  if (hi >= 0) idx = hi;
  render();
})();
</script>
</body>
</html>
